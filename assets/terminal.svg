<svg xmlns="http://www.w3.org/2000/svg" width="860" height="336" viewBox="0 0 860 336" role="img" aria-labelledby="t d">
  <title id="t">pruthvi@bengaluru</title>
  <desc id="d">A terminal. whoami: Pruthvi Shetty, software engineer, Bengaluru. cat now.txt: employee #4 at Seezo, LLMs that review software designs for security. ls side-quests: strata, presenta, pdf-unlock. echo $WEEKEND: anime and games. A small red spider dangles from a web in the corner.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .p { fill: #3fb950; }
    .c { fill: #e6edf3; }
    .o { fill: #8b949e; }
    .me { fill: #e6edf3; font-weight: 700; }
    .sz { fill: #ffa657; }
    .dir { fill: #79c0ff; }
    .wk { fill: #d2a8ff; }
    .bar { fill: #8b949e; font-size: 13px; }
    .tag { fill: #484f58; font-size: 13px; }
    .web { stroke: #30363d; stroke-width: 1; fill: none; }

    .l { opacity: 0; animation: appear .01s linear forwards; }
    .cover { animation-fill-mode: forwards; animation-name: type; }
    .cursor { fill: #e6edf3; animation: blink 1s step-end infinite; }
    .bob { animation: bob 4.5s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blinkeye 5s linear infinite; }

    @keyframes appear { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(34px); } }
    @keyframes blinkeye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes type { to { transform: translateX(var(--w)); } }
  </style>

  <defs>
    <clipPath id="body"><rect x="1" y="37" width="858" height="298" rx="11"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="860" height="336" rx="12" fill="#0d1117"/>
  <path d="M0 12a12 12 0 0 1 12-12h836a12 12 0 0 1 12 12v24H0z" fill="#161b22"/>
  <line x1="0" y1="36.5" x2="860" y2="36.5" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text class="bar" x="430" y="23" text-anchor="middle">pruthvi@bengaluru: ~</text>

  <!-- web in the top-right corner -->
  <g clip-path="url(#body)">
    <path class="web" d="M860 36 L730 36 M860 36 L748 101 M860 36 L795 149 M860 36 L860 166"/>
    <path class="web" d="M832 36 L836 50 L846 60 L860 64"/>
    <path class="web" d="M800 36 L808 66 L830 88 L860 96"/>
    <path class="web" d="M768 36 L780 82 L814 116 L860 128"/>
    <path class="web" d="M738 36 L752 98 L798 144 L860 160"/>
  </g>

  <!-- the problem solving spider -->
  <g clip-path="url(#body)">
    <g transform="translate(790 112)">
      <g class="bob">
        <line x1="0" y1="-400" x2="0" y2="-14" stroke="#8b949e" stroke-width="1"/>
        <g transform="scale(1.35)">
          <g stroke="#f85149" stroke-width="2.2" stroke-linecap="round" fill="none">
            <path d="M-6 -6C-14 -16 -22 -16 -26 -6"/>
            <path d="M-8 -2C-18 -8 -26 -4 -30 4"/>
            <path d="M-8 3C-18 4 -24 10 -26 18"/>
            <path d="M-6 7C-12 14 -16 20 -16 28"/>
            <path d="M6 -6C14 -16 22 -16 26 -6"/>
            <path d="M8 -2C18 -8 26 -4 30 4"/>
            <path d="M8 3C18 4 24 10 26 18"/>
            <path d="M6 7C12 14 16 20 16 28"/>
          </g>
          <ellipse cx="0" cy="0" rx="11" ry="12" fill="#f85149"/>
          <g class="eyes">
            <circle cx="-4" cy="-2" r="3.6" fill="#fff"/>
            <circle cx="4" cy="-2" r="3.6" fill="#fff"/>
            <circle cx="-3.4" cy="-1.4" r="1.6" fill="#0d1117"/>
            <circle cx="4.6" cy="-1.4" r="1.6" fill="#0d1117"/>
          </g>
          <path d="M-3 5Q0 8 3 5" stroke="#0d1117" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- session -->
  <g class="l" style="animation-delay:.4s">
    <text x="28" y="80"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text>
    <rect class="cover" x="46" y="63" width="58.3" height="22" fill="#0d1117" style="--w:54.3px;animation-duration:.6s;animation-delay:.4s;animation-timing-function:steps(6)"/>
  </g>
  <g class="l" style="animation-delay:1.3s">
    <text x="28" y="104"><tspan class="me">pruthvi shetty</tspan><tspan class="o"> · software engineer · bengaluru</tspan></text>
  </g>

  <g class="l" style="animation-delay:1.8s">
    <text x="28" y="138"><tspan class="p">$</tspan><tspan class="c"> cat now.txt</tspan></text>
    <rect class="cover" x="46" y="121" width="103.6" height="22" fill="#0d1117" style="--w:99.6px;animation-duration:.9s;animation-delay:1.8s;animation-timing-function:steps(11)"/>
  </g>
  <g class="l" style="animation-delay:3s">
    <text x="28" y="162"><tspan class="o">employee #4 at </tspan><tspan class="sz">seezo</tspan><tspan class="o">: llms that review software designs for security</tspan></text>
  </g>

  <g class="l" style="animation-delay:3.5s">
    <text x="28" y="196"><tspan class="p">$</tspan><tspan class="c"> ls side-quests/</tspan></text>
    <rect class="cover" x="46" y="179" width="139.8" height="22" fill="#0d1117" style="--w:135.8px;animation-duration:1.1s;animation-delay:3.5s;animation-timing-function:steps(15)"/>
  </g>
  <g class="l" style="animation-delay:4.9s">
    <text y="220" class="dir"><tspan x="28">strata/</tspan><tspan x="136">presenta/</tspan><tspan x="262">pdf-unlock/</tspan></text>
  </g>

  <g class="l" style="animation-delay:5.4s">
    <text x="28" y="254"><tspan class="p">$</tspan><tspan class="c"> echo $WEEKEND</tspan></text>
    <rect class="cover" x="46" y="237" width="121.7" height="22" fill="#0d1117" style="--w:117.7px;animation-duration:1s;animation-delay:5.4s;animation-timing-function:steps(13)"/>
  </g>
  <g class="l" style="animation-delay:6.7s">
    <text x="28" y="278" class="wk">anime &amp;&amp; games</text>
  </g>

  <g class="l" style="animation-delay:7.2s">
    <text x="28" y="312" class="p">$</text>
    <rect class="cursor" x="46" y="298" width="9" height="18"/>
  </g>
  <text class="tag" x="836" y="312" text-anchor="end"># the problem solving spider</text>

  <rect x=".5" y=".5" width="859" height="335" rx="11.5" fill="none" stroke="#30363d"/>
</svg>
